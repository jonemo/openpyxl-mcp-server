name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_DOWNLOADS: never # build with the setup-python interpreter, not a uv-managed one
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Build executable
        run: uv run pyinstaller openpyxl_mcp_server.spec

      - name: Build wheel and sdist
        run: uv build
