[project]
name = "openpyxl-mcp-server"
version = "0.2.1"
description = "MCP server that lets LLMs inspect Excel workbooks via openpyxl"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0,<3",
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
openpyxl-mcp-server = "openpyxl_mcp_server:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["openpyxl_mcp_server.py"]
